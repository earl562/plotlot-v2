name: Lookup format diagnostic

on:
  push:
    branches:
      - feat/lookup-reliability-openrouter-rag

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plotlot
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          cache-dependency-glob: plotlot/uv.lock
      - run: uv sync --frozen --extra dev
      - name: Show formatter diff
        run: uv run ruff format --diff src/plotlot/retrieval/llm.py
