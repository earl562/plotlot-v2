name: Foundation Review Snapshot

on:
  push:
    branches: ["codex/plotlot-foundation-20260914"]
    paths: [".github/workflows/foundation-review.yml"]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Archive tracked baseline for isolated review
        run: |
          git archive --format=tar.gz --output=foundation-source.tar.gz HEAD
          git rev-parse HEAD > foundation-commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: foundation-review-source
          path: |
            foundation-source.tar.gz
            foundation-commit.txt
          retention-days: 1
  offline-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download test tooling without application secrets
        run: python -m pip download --only-binary=:all: --dest foundation-wheels ruff mypy openai
      - uses: actions/upload-artifact@v7
        with:
          name: foundation-offline-tooling
          path: foundation-wheels/
          retention-days: 1
