name: Foundation Review Snapshot

on:
  push:
    branches: ["codex/plotlot-foundation-20260914"]
    paths: [".github/workflows/foundation-review.yml"]

permissions:
  contents: read

jobs:
  offline-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download test tooling without application secrets
        run: |
          python -m pip download --only-binary=:all: --dest foundation-wheels ruff mypy openai types-jsonschema
      - uses: actions/upload-artifact@v7
        with:
          name: foundation-offline-tooling
          path: foundation-wheels/
          retention-days: 1
  ui-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plotlot/frontend/package-lock.json
      - name: Prepare locked frontend dependencies
        working-directory: plotlot/frontend
        run: |
          npm ci
          tar -czf ../../foundation-ui-deps.tar.gz node_modules
      - uses: actions/upload-artifact@v7
        with:
          name: foundation-ui-tooling
          path: foundation-ui-deps.tar.gz
          retention-days: 1
